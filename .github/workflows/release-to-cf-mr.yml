name: Releases to CurseForge and/or Modrinth

on:
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.jar' \
            --dir release-assets

          # Detect the jar with the shortest base name
          cd release-assets
          jars=( *.jar )
          if [ ! -e "${jars[0]}" ]; then
            echo "::error::No .jar assets found in the release" >&2
            exit 1
          fi
          primary_base=""
          for f in "${jars[@]}"; do
            base="${f%.jar}"
            if [ -z "$primary_base" ] || [ "${#base}" -lt "${#primary_base}" ]; then
              primary_base="$base"
            fi
          done
          primary="${primary_base}.jar"
          echo "Primary file: ${primary}"
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"

      - uses: Kir-Antipov/mc-publish@v3
        with:
          # Only include this section if you wish to publish
          # your assets on Modrinth.
          modrinth-id: placeholder
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Only include this section if you wish to publish
          # your assets on CurseForge.
          curseforge-id: placeholder
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            release-assets/${{ steps.release.outputs.primary }}
            release-assets/*.jar
          loaders: neoforge
          environment: client | server
          game-versions: 1.12.2
          java: |
            25
          version: ${{ steps.release.outputs.tag }}
          changelog: '[View changelog on GitHub](${{ steps.release.outputs.url }})'
